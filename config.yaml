# Ripple configuration.
# Secrets belong in .env, not here.

ingest:
  # Default query for financial-risk news
  default_query: "bank OR default OR inflation"

  gdelt:
    enabled: true
    base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
    max_records: 250
    source_lang: "english"
    # format is always json, mode is always artlist

  newsapi:
    enabled: true
    # Uses NEWSAPI_KEY from .env. Falls back to RSS if key is missing.
    base_url: "https://newsapi.org/v2/everything"
    page_size: 100
    language: "en"
    sort_by: "relevancy"

  rss:
    # Fallback feeds used when no NewsAPI key is set
    feeds:
      - name: "Reuters Business"
        url: "https://www.reutersagency.com/feed/?taxonomy=best-sectors&post_type=best"
      - name: "CNBC Top News"
        url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
      - name: "Financial Times"
        url: "https://www.ft.com/?format=rss"
      - name: "MarketWatch"
        url: "https://feeds.marketwatch.com/marketwatch/topstories/"

  tweets:
    # Place a Kaggle CSV in this directory. The loader reads all .csv files.
    directory: "data/raw/tweets"

  cache_dir: "data/raw"

  dedup:
    # Drop articles with identical URL or identical title
    enabled: true
    # Only keep articles whose language field equals this (case-insensitive)
    keep_language: "english"

nlp:
  cache_dir: "data/cache"
  sentiment:
    model_name: "ProsusAI/finbert"
    batch_size: 16
  events:
    provider: "gemini"  # options: "zero_shot", "gemini"
    gemini_model: "gemini-1.5-flash"  # Google Gemini Flash model
    zero_shot_model: "facebook/bart-large-mnli"

scoring:
  cluster:
    model_name: "all-MiniLM-L6-v2"
    similarity_threshold: 0.72  # Cosine similarity threshold for clustering within rolling window
    rolling_window_hours: 48    # 48h rolling window
  aggregation:
    source_weights:
      newsapi: 1.0
      gdelt: 1.0
      rss: 1.0
      tweets: 0.6
      benchmark: 1.0
      synthetic: 1.0
    divergence:
      threshold: 0.40  # Sentiment diff between news and social to flag divergence
      min_news_docs: 1
      min_social_docs: 1
  impact:
    weights:
      event_prior: 0.35
      sentiment_confidence: 0.30
      source_breadth: 0.15
      novelty: 0.20
    event_priors:
      Credit Event: 0.95
      Geopolitical: 0.85
      Macroeconomic: 0.80
      Regulatory/Legal: 0.75
      Operational/Cyber: 0.70
      Commodity/Supply Chain: 0.65
      Merger/Acquisition: 0.60
      Corporate/Product: 0.50
      Other: 0.30
  storage:
    signals_jsonl: "data/signals/signals.jsonl"
    signals_db: "data/signals/signals.db"

stress:
  trigger_impact_score: 7.0       # Trigger rule: stress portfolio if impact_score >= 7.0
  min_analogs: 3                  # N analogs threshold: if fewer, shrink towards prior table
  default_horizon_days: 5         # 5-day cumulative forward shock horizon
  output_dir: "data/stress_runs"
  loan_k_sensitivity: 2.0         # k in stressed PD = min(1.0, PD * exp(k * sector_intensity))
  prior_shocks:
    Credit Event:
      yield_10y: -0.0015          # -15 bps flight-to-safety
      credit_spread: 0.0045       # +45 bps spread widening
      brent_oil: -0.015           # -1.5% oil drop
      fx_dxy: 0.008               # +0.8% USD flight
      equity_us: -0.025           # -2.5% market drop
    Macroeconomic:
      yield_10y: 0.0025           # +25 bps rate hike
      credit_spread: 0.0020       # +20 bps widening
      brent_oil: 0.010            # +1.0%
      fx_dxy: 0.012               # +1.2% USD rise
      equity_us: -0.018           # -1.8%
    Geopolitical:
      yield_10y: -0.0010          # -10 bps flight to safety
      credit_spread: 0.0035       # +35 bps widening
      brent_oil: 0.065            # +6.5% oil price spike
      fx_dxy: 0.015               # +1.5% USD rally
      equity_us: -0.030           # -3.0%
    Commodity/Supply Chain:
      yield_10y: 0.0010           # +10 bps inflation pressure
      credit_spread: 0.0025       # +25 bps widening
      brent_oil: 0.080            # +8.0% oil spike
      fx_dxy: 0.006               # +0.6%
      equity_us: -0.020           # -2.0%
    Operational/Cyber:
      yield_10y: 0.0000
      credit_spread: 0.0015
      brent_oil: 0.0000
      fx_dxy: 0.0000
      equity_us: -0.015
    Regulatory/Legal:
      yield_10y: 0.0000
      credit_spread: 0.0020
      brent_oil: 0.0000
      fx_dxy: 0.0000
      equity_us: -0.012
    Corporate/Product:
      yield_10y: 0.0000
      credit_spread: 0.0010
      brent_oil: 0.0000
      fx_dxy: 0.0000
      equity_us: -0.008
    Merger/Acquisition:
      yield_10y: 0.0000
      credit_spread: 0.0012
      brent_oil: 0.0000
      fx_dxy: 0.0000
      equity_us: 0.005
    Other:
      yield_10y: 0.0005
      credit_spread: 0.0010
      brent_oil: 0.0000
      fx_dxy: 0.002
      equity_us: -0.005



