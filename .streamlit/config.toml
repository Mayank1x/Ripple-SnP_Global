[theme]
base = "dark"
primaryColor = "#2D6BFF"
backgroundColor = "#070E1A"
secondaryBackgroundColor = "#0E1A2E"
textColor = "#F8FAFC"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
